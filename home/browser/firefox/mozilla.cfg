function applyCustomScriptToNewWindow(win){
  /*** Context menu changes ***/
  let myKeyChanges = [
    {
      id: 'Browser:ShowAllBookmarks',
      newkey: 'a',
      newlabel: 'Copy Link Location'
    },
    {
      id: 'context-copyemail',
      newkey: 'A',
      newlabel: 'Copy Email Address'
    }
  ];
  for (var i=0; i<myKeyChanges.length; i++){
    var menuitem = win.document.getElementById(myKeyChanges[i].id);
    if (menuitem){
      if (myKeyChanges[i].newkey.length == 1){
        menuitem.setAttribute('accesskey', myKeyChanges[i].newkey);
      }
      if (myKeyChanges[i].newlabel.length > 0){
        menuitem.setAttribute('label', myKeyChanges[i].newlabel);
      }
    }
  }
  /*** Other changes ***/
}
/* Single function userChrome.js loader to run the above init function (no external scripts)
  derived from https://www.reddit.com/r/firefox/comments/kilmm2/ */
try {
  // Firefox's autoconfig sandbox provides Services directly. The old
  // Components.utils.import API was removed in Firefox 152.
  function installUltimaTabKeys(window) {
    const browser = window.gBrowser || window._gBrowser;
    if (window.__zarredUltimaTabKeysInstalled || !browser) return;
    if (!Services.prefs.getBoolPref('sidebar.verticalTabs', false)) return;
    window.__zarredUltimaTabKeysInstalled = true;
    let tabNavigationMode = false;
    const activateTabMode = target => {
      const editable = target?.matches?.(
        'input, textarea, select, [contenteditable="true"], #urlbar-input'
      );
      if (editable) return false;
      tabNavigationMode = true;
      showAndFocusTabs();
      return true;
    };

    const getVerticalTabs = () => window.document.querySelector(
      '#sidebar-main #tabbrowser-tabs[orient="vertical"]'
    );
    const focusSelectedTab = () => {
      const tabs = getVerticalTabs();
      if (!tabs) return;
      const selected = tabs.querySelector('.tabbrowser-tab[selected]');
      (selected || tabs).focus();
    };
    const showAndFocusTabs = () => {
      const sidebar = window.document.getElementById('sidebar-main');
      if (!sidebar) return;
      if (!sidebar.hasAttribute('sidebar-launcher-expanded')) {
        const toggleKey = window.document.getElementById('toggleSidebarKb');
        const button = window.document.querySelector(
          '#sidebar-launcher-button, #sidebar-button, [command="viewSidebar"]'
        );
        if (toggleKey?.doCommand) toggleKey.doCommand();
        else button?.click();
      }
      window.setTimeout(focusSelectedTab, 120);
    };
    const selectAdjacentTab = direction => {
      const tabs = getVerticalTabs();
      if (!tabs) return;
      const tabElements = [...tabs.querySelectorAll(
        '.tabbrowser-tab:not([hidden]):not([collapsed])'
      )];
      if (!tabElements.length) return;
      const current = tabElements.indexOf(browser.selectedTab);
      const next = (current + direction + tabElements.length) % tabElements.length;
      browser.selectedTab = tabElements[next];
      tabElements[next].focus();
    };

    const handleKey = event => {
      // The event may be seen once by the chrome window and once by the
      // embedded content browser. Handle it only at the first boundary.
      if (event.__zarredUltimaTabKeyHandled) return;
      const editable = event.target?.matches?.(
        'input, textarea, select, [contenteditable="true"], #urlbar-input'
      );
      if (event.ctrlKey || event.altKey || event.metaKey || event.shiftKey) return;
      if (event.key === 't' && !editable) {
        event.__zarredUltimaTabKeyHandled = true;
        event.preventDefault();
        event.stopPropagation();
        activateTabMode(event.target);
        return;
      }
      if (!tabNavigationMode) return;
      if (event.key === 'Escape') {
        event.__zarredUltimaTabKeyHandled = true;
        tabNavigationMode = false;
      } else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
        event.__zarredUltimaTabKeyHandled = true;
        event.preventDefault();
        event.stopPropagation();
        selectAdjacentTab(event.key === 'ArrowUp' ? -1 : 1);
      } else {
        tabNavigationMode = false;
      }
    };

    window.addEventListener('keydown', handleKey, true);
    browser.addEventListener('keydown', handleKey, true);

    // Trusted key events from web content live in the content process. A
    // frame script forwards only the short tab-navigation key sequence back
    // to this browser's chrome process.
    if (!Services.mm.__zarredUltimaFrameScriptLoaded) {
      const frameScript =
        "(function() {" +
        "let tabMode = false;" +
        "const editable = target => target && target.matches && " +
          "target.matches('input, textarea, select, [contenteditable]');" +
        "addEventListener('keydown', event => {" +
          "if (event.ctrlKey || event.altKey || event.metaKey || event.shiftKey) return;" +
          "if (event.key === 't' && !editable(event.target)) {" +
            "tabMode = true; event.preventDefault(); " +
            "sendAsyncMessage('zarred:ultima-tab-key', { key: 't' });" +
          "} else if (tabMode && (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {" +
            "event.preventDefault(); " +
            "sendAsyncMessage('zarred:ultima-tab-key', { key: event.key });" +
          "} else if (tabMode) {" +
            "tabMode = false; " +
            "sendAsyncMessage('zarred:ultima-tab-key', { key: 'reset' });" +
          "}" +
        "}, true);" +
        "})();";
      Services.mm.loadFrameScript(
        'data:application/javascript,' + encodeURIComponent(frameScript),
        true
      );
      Services.mm.__zarredUltimaFrameScriptLoaded = true;
    }

    const attachContentKeys = targetBrowser => {
      const messageManager = targetBrowser?.messageManager;
      if (!messageManager || messageManager.__zarredUltimaKeyListener) return;
      const listener = message => {
        const key = message.data?.key;
        if (key === 't') {
          activateTabMode(window.document.commandDispatcher.focusedElement);
        } else if (key === 'ArrowUp' || key === 'ArrowDown') {
          if (tabNavigationMode) {
            selectAdjacentTab(key === 'ArrowUp' ? -1 : 1);
          }
        } else if (key === 'reset') {
          tabNavigationMode = false;
        }
      };
      messageManager.addMessageListener('zarred:ultima-tab-key', listener);
      messageManager.__zarredUltimaKeyListener = true;
    };

    const attachToSelectedBrowser = () => {
      attachContentKeys(browser.selectedBrowser);
    };
    browser.tabContainer?.addEventListener('TabSelect', attachToSelectedBrowser);
    browser.tabContainer?.addEventListener('TabOpen', event => {
      attachContentKeys(event.target.linkedBrowser);
    });
    attachToSelectedBrowser();

    // A chrome-window listener cannot see trusted key events from remote web
    // content. Firefox's native keyset can, so use it as the primary trigger.
    const keyset = window.document.getElementById('mainKeyset');
    if (keyset && !window.document.getElementById('zarred-ultima-tab-key')) {
      const key = window.document.createXULElement('key');
      key.id = 'zarred-ultima-tab-key';
      key.setAttribute('key', 't');
      key.addEventListener('command', () => {
        activateTabMode(window.document.commandDispatcher.focusedElement);
      });
      keyset.appendChild(key);
    }
  }

  function initUltimaBrowserWindow(window) {
    if (!window || (!window.gBrowser && !window._gBrowser)) return;
    applyCustomScriptToNewWindow(window);
    installUltimaTabKeys(window);
  }

  function ConfigJS() { Services.obs.addObserver(this, 'chrome-document-global-created', false); }
  ConfigJS.prototype = {
    observe: function (aSubject) { aSubject.addEventListener('DOMContentLoaded', this, {once: true}); },
    handleEvent: function (aEvent) {
      let document = aEvent.originalTarget; let window = document.defaultView; let location = window.location;
      if (/^(chrome:(?!\/\/(global\/content\/commonDialog|browser\/content\/webext-panels)\.x?html)|about:(?!blank))/i.test(location.href)) {
        initUltimaBrowserWindow(window);
      }
    }
  };
  if (!Services.appinfo.inSafeMode) {
    new ConfigJS();
    Services.obs.addObserver({
      observe(subject, topic) {
        if (topic === 'browser-delayed-startup-finished') {
          initUltimaBrowserWindow(subject);
        }
      }
    }, 'browser-delayed-startup-finished');
  }
} catch(ex) {};

